[project]
name = "ticket-pipeline"
version = "0.2.0"
description = "Автоматизация обработки тикетов поддержки: FastAPI + LangChain + SQLite"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W — pycodestyle, F — pyflakes, I — сортировка импортов, B — bugbear,
# UP — современный синтаксис, SIM — упрощения, RUF — специфичные правила
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003: «неоднозначные» символы — кириллица в тексте и «—»; проект русскоязычный
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# FastAPI-зависимости в сигнатуре — вызов функции в дефолте, это идиома фреймворка
"src/app/api/*.py" = ["B008"]
